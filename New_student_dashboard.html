<body>
<div class="dashboard-container">
        <!-- Header -->

            <div class="header-content">

                    <div class="user-actions">

        <!-- Main Content -->

            <!-- Main Dashboard -->

<script>
  // ====================================================================
// STUDENT TIMETABLE DASHBOARD - PRODUCTION VERSION
// ====================================================================

// ====================================================================
// 1. GLOBAL VARIABLES & CONFIGURATION
// ====================================================================

// API Configuration
const API_BASE_URL = 'http://127.0.0.1:8000';  // Your FastAPI backend URL
let authToken = null;  // Will be populated from localStorage

// View state management
let currentView = 'day';
let currentDate = new Date();
const timeSlots = ["08:00", "09:00", "10:00", "11:00", "12:00", "13:00", "14:00", "15:00", "16:00", "17:00", "18:00", "19:00"];
const weekDays = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];

// Student data (populated from API - NO HARDCODED DATA)
let studentData = {
    id: null,
    username: null,
    email: null,
    role: null,
    class: null,
    semester: null,
    subjects: []
};

// Timetable data (populated from API - NO HARDCODED DATA)
let timetableHistory = [];
let timetableData = {
    monday: [],
    tuesday: [],
    wednesday: [],
    thursday: [],
    friday: [],
    saturday: [],
    sunday: []
};

// ====================================================================
// 2. INITIALIZATION FUNCTIONS
// ====================================================================

/**
 * Initialize Dashboard UI Elements
 */
function initializeDashboardUI() {
    console.log('Initializing Dashboard UI...');

    // Sidebar toggle for mobile
    const sidebarToggle = document.getElementById('sidebarToggle');
    const sidebar = document.querySelector('.sidebar');

    if (sidebarToggle && sidebar) {
        sidebarToggle.addEventListener('click', function() {
            sidebar.classList.toggle('active');
        });
    }

    // Close modals when clicking outside
    document.addEventListener('click', function(e) {
        if (e.target.classList.contains('modal')) {
            closeModal();
        }
    });

    // Animate dashboard elements on load
    animateElements();

    console.log('Dashboard UI initialized');
}

/**
 * Initialize Dashboard Data from API
 * Fetches ALL data from backend - NO hardcoded data
 */
async function initializeDashboard() {
    console.log('=== Fetching Dashboard Data from API ===');

    try {
        // ============================================
        // STEP 1: Fetch Student Profile
        // ============================================
        console.log('Fetching student profile...');
        const userResponse = await fetch(`${API_BASE_URL}/student/me`, {
            method: 'GET',
            headers: { 'Authorization': `Bearer ${authToken}` }
        });

        if (!userResponse.ok) {
            if (userResponse.status === 401) {
                throw new Error('Session expired. Please log in again.');
            }
            throw new Error(`Failed to fetch user data: ${userResponse.status}`);
        }

        const userData = await userResponse.json();
        console.log('✓ Student profile loaded:', userData);

        // Populate student data (NO defaults, all from API)
        studentData.id = userData.id;
        studentData.username = userData.username;
        studentData.email = userData.email || 'N/A';
        studentData.role = userData.role || 'Student';
        studentData.class = userData.class || 'N/A';
        studentData.semester = userData.semester || 'N/A';

        // ============================================
        // STEP 2: Fetch Student Subjects
        // ============================================
        console.log('Fetching subjects...');
        const subjectsResponse = await fetch(`${API_BASE_URL}/student/subjects`, {
            method: 'GET',
            headers: { 'Authorization': `Bearer ${authToken}` }
        });

        if (!subjectsResponse.ok) {
            throw new Error(`Failed to fetch subjects: ${subjectsResponse.status}`);
        }

        studentData.subjects = await subjectsResponse.json();
        console.log('✓ Subjects loaded:', studentData.subjects.length, 'subjects');

        // ============================================
        // STEP 3: Fetch Timetable History
        // ============================================
        console.log('Fetching timetable...');
        const historyResponse = await fetch(`${API_BASE_URL}/student/timetable_history`, {
            method: 'GET',
            headers: { 'Authorization': `Bearer ${authToken}` }
        });

        if (!historyResponse.ok) {
            throw new Error(`Failed to fetch timetable: ${historyResponse.status}`);
        }

        timetableHistory = await historyResponse.json();
        console.log('✓ Timetable loaded:', timetableHistory.length, 'entries');

        // ============================================
        // STEP 4: Organize Data
        // ============================================
        organizeTimetableData();

        // ============================================
        // STEP 5: Update All UI Elements
        // ============================================
        updateDateDisplay();
        loadStudentInfo();
        loadSubjects();
        loadUpcomingEvents();
        updateQuickStats();
        updateCalendar();

        console.log('=== Dashboard Loaded Successfully ===');
        showNotification('Welcome back, ' + studentData.username + '!', 'success');

    } catch (error) {
        console.error('❌ Dashboard initialization error:', error);
        showNotification(`Error: ${error.message}`, 'error');

        // If authentication error, redirect to login
        if (error.message.includes('Session expired') || error.message.includes('401')) {
            setTimeout(() => {
                localStorage.removeItem('token');
                window.location.href = '/';
            }, 2000);
        }
    }
}

/**
 * Organize timetable history into day-based structure
 */
function organizeTimetableData() {
    console.log('Organizing timetable data...');

    // Reset timetable data
    timetableData = {
        monday: [],
        tuesday: [],
        wednesday: [],
        thursday: [],
        friday: [],
        saturday: [],
        sunday: []
    };

    // Group timetable entries by day
    timetableHistory.forEach(entry => {
        const day = entry.day.toLowerCase();

        if (timetableData[day]) {
            timetableData[day].push({
                id: entry.id,
                time: entry.time,
                subject: entry.subject,
                room: entry.room,
                instructor: entry.instructor,
                type: entry.type
            });
        }
    });

    // Sort each day's classes by time
    Object.keys(timetableData).forEach(day => {
        timetableData[day].sort((a, b) => a.time.localeCompare(b.time));
    });

    console.log('✓ Timetable organized:', Object.values(timetableData).flat().length, 'total classes');
}

// ====================================================================
// 3. STUDENT DATA DISPLAY FUNCTIONS
// ====================================================================

/**
 * Load and display student information
 * Uses ACTUAL data from API (not hardcoded)
 */
function loadStudentInfo() {
    console.log('Loading student info...');

    const studentName = document.getElementById('studentName');
    if (studentName) {
        studentName.textContent = `${studentData.username} (${studentData.role})`;
    }

    const studentID = document.getElementById('studentID');
    if (studentID) {
        studentID.textContent = studentData.username;
    }

    const studentClass = document.getElementById('studentClass');
    if (studentClass) {
        studentClass.textContent = studentData.class;
    }

    const studentSemester = document.getElementById('studentSemester');
    if (studentSemester) {
        studentSemester.textContent = studentData.semester;
    }

    // ✅ NEW: Update student photo
    const studentPhoto = document.getElementById('studentPhoto');
    if (studentPhoto && studentData.photo) {
        if (studentData.photo.startsWith('data:image') || studentData.photo.startsWith('http')) {
            studentPhoto.src = studentData.photo;
        } else {
            const name = studentData.username || 'Student';
            studentPhoto.src = `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&size=80&background=fae1dd&color=5a4037`;
        }
    }

    console.log('✓ Student info displayed:', studentData.username);
}

/**
 * Load and display subjects list
 * Dynamically generated from API data
 */
function loadSubjects() {
    console.log('Loading subjects...');

    const subjectsList = document.getElementById('subjectsList');
    if (!subjectsList) return;

    subjectsList.innerHTML = '';

    if (studentData.subjects && studentData.subjects.length > 0) {
        studentData.subjects.forEach((subject, index) => {
            const subjectElement = document.createElement('div');
            subjectElement.className = `subject-item ${subject.color || 'subject-computer'}`;
            subjectElement.innerHTML = `
                <div>
                    <div class="subject-code">${subject.code}</div>
                    <div class="subject-name">${subject.name}</div>
                </div>
                <div class="subject-credits">${subject.credits} CR</div>
            `;
            subjectElement.addEventListener('click', () => showSubjectDetails(subject));
            subjectsList.appendChild(subjectElement);
        });

        console.log('✓ Loaded', studentData.subjects.length, 'subjects');
    } else {
        subjectsList.innerHTML = '<p style="color: #718096; text-align: center; padding: 1rem;">No subjects enrolled</p>';
        console.log('ℹ No subjects found');
    }
}

/**
 * Load and display upcoming events
 */
function loadUpcomingEvents() {
    console.log('Loading upcoming events...');

    const eventsList = document.getElementById('eventsList');
    if (!eventsList) return;

    eventsList.innerHTML = '';

    // Get upcoming classes from today onwards
    const upcomingEvents = getUpcomingClasses(5);

    if (upcomingEvents.length > 0) {
        upcomingEvents.forEach(event => {
            const eventElement = document.createElement('div');
            eventElement.className = 'event-item';
            eventElement.innerHTML = `
                <div class="event-time">${event.time}</div>
                <div class="event-details">
                    <div class="event-title">${event.subject}</div>
                    <div class="event-type">${event.type} - ${event.day}</div>
                </div>
            `;
            eventsList.appendChild(eventElement);
        });

        console.log('✓ Loaded', upcomingEvents.length, 'upcoming events');
    } else {
        eventsList.innerHTML = '<p style="color: #718096; text-align: center; padding: 1rem; font-size: 0.9rem;">No upcoming events</p>';
        console.log('ℹ No upcoming events');
    }
}

/**
 * Get upcoming classes from current date
 */
function getUpcomingClasses(count = 5) {
    const upcoming = [];
    const today = new Date();
    const currentDayName = today.toLocaleDateString('en-US', { weekday: 'long' }).toLowerCase();
    const currentTime = today.toTimeString().substring(0, 5);

    // Get today's remaining classes
    const todayClasses = timetableData[currentDayName] || [];
    todayClasses.forEach(cls => {
        if (cls.time >= currentTime) {
            upcoming.push({ ...cls, day: 'Today' });
        }
    });

    // Get classes from upcoming days
    const daysOrder = ['monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday', 'sunday'];
    const currentDayIndex = daysOrder.indexOf(currentDayName);

    for (let i = 1; i < 7 && upcoming.length < count; i++) {
        const nextDayIndex = (currentDayIndex + i) % 7;
        const nextDayName = daysOrder[nextDayIndex];
        const nextDayClasses = timetableData[nextDayName] || [];

        nextDayClasses.forEach(cls => {
            if (upcoming.length < count) {
                upcoming.push({
                    ...cls,
                    day: nextDayName.charAt(0).toUpperCase() + nextDayName.slice(1)
                });
            }
        });
    }

    return upcoming.slice(0, count);
}

/**
 * Update quick statistics
 * Calculated from ACTUAL data (not hardcoded)
 */
function updateQuickStats() {
    console.log('Updating quick stats...');

    // Get today's day name
    const today = currentDate.toLocaleDateString('en-US', { weekday: 'long' }).toLowerCase();

    // Calculate stats from actual data
    const todayClasses = getTodayClasses(today);
    const weekClasses = getTotalWeekClasses();
    const totalCredits = studentData.subjects ?
        studentData.subjects.reduce((sum, subject) => sum + (subject.credits || 0), 0) : 0;

    // Update DOM
    const todayClassesEl = document.getElementById('todayClasses');
    const weekClassesEl = document.getElementById('weekClasses');
    const totalCreditsEl = document.getElementById('totalCredits');

    if (todayClassesEl) todayClassesEl.textContent = todayClasses.length;
    if (weekClassesEl) weekClassesEl.textContent = weekClasses;
    if (totalCreditsEl) totalCreditsEl.textContent = totalCredits;

    console.log('✓ Stats updated:', { today: todayClasses.length, week: weekClasses, credits: totalCredits });
}

/**
 * Get classes for a specific day
 */
function getTodayClasses(day) {
    return timetableData[day] || [];
}

/**
 * Get total classes for entire week
 */
function getTotalWeekClasses() {
    return Object.values(timetableData).reduce((total, day) => total + day.length, 0);
}

/**
 * Get weekly class count for a specific subject
 */
function getWeeklyClassCount(subjectCode) {
    let count = 0;
    Object.values(timetableData).forEach(day => {
        count += day.filter(cls => cls.subject === subjectCode).length;
    });
    return count;
}

// ====================================================================
// 4. CALENDAR VIEW MANAGEMENT
// ====================================================================

/**
 * Switch between Day/Week/Month views
 */
window.switchView = function(view) {
    currentView = view;

    // Update button states
    document.querySelectorAll('.toggle-btn').forEach(btn => btn.classList.remove('active'));
    const activeBtn = document.querySelector(`[data-view="${view}"]`);
    if (activeBtn) activeBtn.classList.add('active');

    // Hide all views
    document.querySelectorAll('.view-content').forEach(content => content.classList.remove('active'));

    // Show selected view
    const viewContent = document.getElementById(`${view}View`);
    if (viewContent) viewContent.classList.add('active');

    // Update calendar content
    updateCalendar();

    console.log('Switched to', view, 'view');
};

/**
 * Update calendar based on current view
 */
function updateCalendar() {
    switch (currentView) {
        case 'day':
            updateDayView();
            break;
        case 'week':
            updateWeekView();
            break;
        case 'month':
            updateMonthView();
            break;
    }
}

/**
 * Update Day View
 */
function updateDayView() {
    const dayName = currentDate.toLocaleDateString('en-US', { weekday: 'long' }).toLowerCase();
    const dayClasses = getTodayClasses(dayName);

    // Update date display
    const dayViewDate = document.getElementById('dayViewDate');
    if (dayViewDate) {
        dayViewDate.textContent = currentDate.toLocaleDateString('en-US', {
            weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
        });
    }

    // Get slots container
    const slotsContainer = document.getElementById('daySlots');
    if (!slotsContainer) return;

    slotsContainer.innerHTML = '';

    // Create time slots
    timeSlots.forEach(time => {
        const classForTime = dayClasses.find(cls => cls.time === time);

        const timeSlot = document.createElement('div');
        timeSlot.className = 'time-slot';

        const timeLabel = document.createElement('div');
        timeLabel.className = 'time-label';
        timeLabel.textContent = time;

        const slotContent = document.createElement('div');
        slotContent.className = 'slot-content';

        if (classForTime) {
            slotContent.classList.add('has-class');

            const subject = studentData.subjects ?
                studentData.subjects.find(s => s.code === classForTime.subject) : null;

            slotContent.innerHTML = `
                <div class="class-info">
                    <div class="class-subject">${classForTime.subject}${subject ? ' - ' + subject.name : ''}</div>
                    <div class="class-details">
                        <span class="class-room">${classForTime.room}</span>
                        <span>${classForTime.instructor}</span>
                        <span>${classForTime.type}</span>
                    </div>
                </div>
            `;
            slotContent.addEventListener('click', () => showClassDetails(classForTime));
        }

        timeSlot.appendChild(timeLabel);
        timeSlot.appendChild(slotContent);
        slotsContainer.appendChild(timeSlot);
    });

    console.log('Day view updated:', dayClasses.length, 'classes on', dayName);
}

/**
 * Update Week View
 */
function updateWeekView() {
    const weekTimetable = document.getElementById('weekTimetable');
    if (!weekTimetable) return;

    weekTimetable.innerHTML = '';

    // Create corner cell
    const corner = document.createElement('div');
    corner.className = 'week-corner';
    corner.textContent = 'Time';
    weekTimetable.appendChild(corner);

    // Create day headers
    weekDays.forEach(day => {
        const dayHeader = document.createElement('div');
        dayHeader.className = 'week-day-header';
        dayHeader.textContent = day.substring(0, 3);
        weekTimetable.appendChild(dayHeader);
    });

    // Create time slots with classes
    timeSlots.forEach(time => {
        const timeSlot = document.createElement('div');
        timeSlot.className = 'week-time-slot';
        timeSlot.textContent = time;
        weekTimetable.appendChild(timeSlot);

        weekDays.forEach(day => {
            const dayName = day.toLowerCase();
            const dayClasses = timetableData[dayName] || [];
            const classForTime = dayClasses.find(cls => cls.time === time);

            const daySlot = document.createElement('div');
            daySlot.className = 'week-day-slot';

            if (classForTime) {
                daySlot.classList.add('has-class');
                daySlot.innerHTML = `
                    <div class="week-class-subject">${classForTime.subject}</div>
                    <div class="week-class-room">${classForTime.room}</div>
                `;
                daySlot.addEventListener('click', () => showClassDetails(classForTime));
            }

            weekTimetable.appendChild(daySlot);
        });
    });

    console.log('Week view updated');
}

/**
 * Update Month View
 */
function updateMonthView() {
    const monthDaysHeaders = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    const monthHeader = document.getElementById('monthHeader');
    const monthGrid = document.getElementById('monthGrid');

    if (!monthHeader || !monthGrid) return;

    monthHeader.innerHTML = '';
    monthGrid.innerHTML = '';

    // Create day headers
    monthDaysHeaders.forEach(day => {
        const dayHeader = document.createElement('div');
        dayHeader.className = 'month-day-header';
        dayHeader.textContent = day;
        monthHeader.appendChild(dayHeader);
    });

    // Calculate month dates
    const firstDay = new Date(currentDate.getFullYear(), currentDate.getMonth(), 1);
    const startDate = new Date(firstDay);
    startDate.setDate(startDate.getDate() - firstDay.getDay());

    // Create 6 weeks (42 days)
    for (let i = 0; i < 42; i++) {
        const cellDate = new Date(startDate);
        cellDate.setDate(startDate.getDate() + i);

        const dayCell = document.createElement('div');
        dayCell.className = 'month-day';

        if (cellDate.getMonth() !== currentDate.getMonth()) {
            dayCell.classList.add('other-month');
        }

        if (cellDate.toDateString() === new Date().toDateString()) {
            dayCell.classList.add('today');
        }

        dayCell.innerHTML = `
            <div class="month-day-number">${cellDate.getDate()}</div>
            <div class="month-classes"></div>
        `;

        const dayName = cellDate.toLocaleDateString('en-US', { weekday: 'long' }).toLowerCase();
        const dayClasses = timetableData[dayName] || [];
        const classesContainer = dayCell.querySelector('.month-classes');

        dayClasses.slice(0, 3).forEach(() => {
            const indicator = document.createElement('div');
            indicator.className = 'month-class-indicator';
            classesContainer.appendChild(indicator);
        });

        monthGrid.appendChild(dayCell);
    }

    console.log('Month view updated');
}

window.navigateDate = function(direction) {
    switch (currentView) {
        case 'day':
            currentDate.setDate(currentDate.getDate() + direction);
            break;
        case 'week':
            currentDate.setDate(currentDate.getDate() + (direction * 7));
            break;
        case 'month':
            currentDate.setMonth(currentDate.getMonth() + direction);
            break;
    }

    updateDateDisplay();
    updateCalendar();
    updateQuickStats();
};

window.exportTimetable = function() {
    showNotification('Preparing timetable export...', 'info');

    setTimeout(() => {
        try {
            let csvContent = "Day,Time,Subject Code,Subject Name,Room,Instructor,Type,Credits\n";

            Object.entries(timetableData).forEach(([day, classes]) => {
                classes.forEach(cls => {
                    const subject = studentData.subjects ?
                        studentData.subjects.find(s => s.code === cls.subject) : null;

                    const subjectName = subject ? subject.name : cls.subject;
                    const credits = subject ? subject.credits : 'N/A';

                    const escapeCsv = (text) => {
                        if (text.includes(',') || text.includes('"')) {
                            return `"${text.replace(/"/g, '""')}"`;
                        }
                        return text;
                    };

                    csvContent += `${day},${cls.time},${cls.subject},${escapeCsv(subjectName)},${cls.room},${escapeCsv(cls.instructor)},${cls.type},${credits}\n`;
                });
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = window.URL.createObjectURL(blob);
            const link = document.createElement('a');

            const filename = `timetable_${studentData.username}_${new Date().toISOString().split('T')[0]}.csv`;
            link.href = url;
            link.download = filename;

            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            window.URL.revokeObjectURL(url);

            showNotification('Timetable exported successfully!', 'success');
            console.log('Exported to', filename);

        } catch (error) {
            console.error('Export error:', error);
            showNotification('Export failed: ' + error.message, 'error');
        }
    }, 500);
};

window.syncCalendar = function() {

// ====================================================================
// 8. NOTIFICATION SYSTEM
// ====================================================================

function showNotification(message, type = 'info') {
    const existingNotifications = document.querySelectorAll('.notification');
    existingNotifications.forEach(notification => notification.remove());

    const notification = document.createElement('div');
    notification.className = `notification notification-${type}`;
    notification.innerHTML = `
        <div class="notification-content">
            <i class="fas fa-${getNotificationIcon(type)}"></i>
            <span>${message}</span>
        </div>
        <button class="notification-close" onclick="this.parentElement.remove()">
            <i class="fas fa-times"></i>
        </button>
    `;

    notification.style.cssText = `
        position: fixed;
        top: 20px;
        right: 20px;
        background: white;
        border-left: 4px solid ${getNotificationColor(type)};
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
        border-radius: 8px;
        padding: 1rem;
        z-index: 10000;
        display: flex;
        align-items: center;
        gap: 1rem;
        min-width: 300px;
        max-width: 500px;
        animation: slideInRight 0.3s ease;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    `;

    document.body.appendChild(notification);

    setTimeout(() => {
        if (notification.parentElement) {
            notification.style.animation = 'slideOutRight 0.3s ease';
            setTimeout(() => notification.remove(), 300);
        }
    }, 5000);
}

function getNotificationIcon(type) {
    switch(type) {
        case 'success': return 'check-circle';
        case 'error': return 'exclamation-circle';
        case 'warning': return 'exclamation-triangle';
        default: return 'info-circle';
    }
}

function getNotificationColor(type) {
    switch(type) {
        case 'success': return '#38a169';
        case 'error': return '#e53e3e';
        case 'warning': return '#ed8936';
        default: return '#667eea';
    }
}

// ==================== BROWSER NOTIFICATION FUNCTIONS ====================

// Request notification permission (runs once)
function requestNotificationPermission() {
    // Check if browser supports notifications
    if (!("Notification" in window)) {
        console.log("❌ This browser doesn't support notifications");
        return;
    }

    console.log("📢 Current notification permission:", Notification.permission);

    if (Notification.permission === "granted") {
        console.log("✅ Notifications already enabled");
        return;
    }

    // Ask user for permission
    if (Notification.permission !== "denied") {
        Notification.requestPermission().then(function(permission) {
            if (permission === "granted") {
                console.log("✅ User allowed notifications!");

                // Show welcome notification
                new Notification("🎉 TimeWeaver Notifications Active", {
                    body: "You'll receive updates even when in another tab!",
                    icon: "https://via.placeholder.com/128?text=TW",
                    tag: "welcome"
                });
            } else {
                console.log("❌ User denied notifications");
            }
        });
    }
}

// Show browser notification
function showBrowserNotification(title, message, options = {}) {
    console.log("📢 Attempting browser notification:", title);

    // Check if notifications are supported
    if (!("Notification" in window)) {
        console.log("❌ Browser doesn't support notifications");
        showNotification(message, 'info');
        return;
    }

    // Check if user gave permission
    if (Notification.permission === "granted") {
        console.log("✅ Showing browser notification");

        // Create notification
        const notification = new Notification(title, {
            body: message,
            icon: options.icon || "https://via.placeholder.com/128?text=TW",
            badge: "https://via.placeholder.com/96?text=TW",
            tag: options.tag || "timeweaver-student",
            requireInteraction: false,
            silent: false
        });

        // When user clicks notification
        notification.onclick = function(event) {
            event.preventDefault();
            console.log("👆 Notification clicked");
            window.focus();
            notification.close();

            if (options.onClick) {
                options.onClick();
            }
        };

        // Auto-close after 10 seconds
        setTimeout(() => notification.close(), 10000);

    } else if (Notification.permission === "denied") {
        console.log("❌ Notifications denied, using fallback");
        showNotification(message, 'info');
    } else {
        console.log("⚠️ Permission not granted, requesting...");
        requestNotificationPermission();
        showNotification(message, 'info');
    }
}

// ✅ UPLOAD STUDENT PHOTO
async function uploadStudentPhoto() {
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.accept = 'image/jpeg,image/jpg,image/png,image/gif';

    fileInput.onchange = async function(e) {
        const file = e.target.files[0];
        if (!file) return;

        // Check file size (max 2MB)
        const maxSize = 2 * 1024 * 1024;
        if (file.size > maxSize) {
            showNotification('⚠️ Image too large! Please use an image smaller than 2MB.', 'error');
            return;
        }

        // Check file type
        if (!file.type.startsWith('image/')) {
            showNotification('⚠️ Please select an image file (JPG, PNG, GIF)', 'error');
            return;
        }

        const formData = new FormData();
        formData.append('file', file);

        showNotification('Uploading photo...', 'info');

        try {
            const response = await fetch(`${API_BASE_URL}/admin/upload_student_photo/${studentData.id}`, {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${authToken}` },
                body: formData
            });

            if (response.ok) {
                const result = await response.json();
                showNotification('✅ Photo uploaded successfully!', 'success');

                // Update photo immediately
                studentData.photo = result.photo;
                loadStudentInfo();
            } else {
                const error = await response.json();
                throw new Error(error.detail || 'Failed to upload photo');
            }
        } catch (err) {
            showNotification('❌ Error: ' + err.message, 'error');
        }
    };

    fileInput.click();
}
